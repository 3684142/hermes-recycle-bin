name: recycle-bin
version: 1.1.0
description: "Send Hermes terminal `rm` deletions to the Windows Recycle Bin instead of deleting permanently. Toggle with `hermes plugins enable|disable recycle-bin`."
author: 3684142
kind: standalone
# NOTE: no `manifest_version: 2` marker on purpose. The manifest LOADER accepts v2,
# but `hermes plugins install` (hermes_cli/plugins_cmd.py::_SUPPORTED_MANIFEST_VERSION)
# still caps at 1 and refuses the install outright. These v2 metadata fields parse fine
# without the marker, so the plugin stays installable on current releases.
license: MIT
homepage: https://github.com/3684142/hermes-recycle-bin
tags: [safety, filesystem, windows, recycle-bin, rm]
platforms:
  - windows
provides_hooks:
  - pre_tool_call
hooks:
  - pre_tool_call
